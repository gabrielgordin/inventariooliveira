# Gera o APK assinado a cada envio para a branch main (ou pelo botão "Run workflow")
# e publica em Releases, de onde dá para baixar direto no celular.
name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os segredos KEYSTORE_BASE64 e KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/inventario.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/inventario.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências e copiar o app para o projeto Android
        run: |
          npm ci
          npx cap sync android

      - name: Compilar o APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: inventario
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "inventario-florestal-1.0.${{ github.run_number }}.apk"

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Inventário Florestal 1.0.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message || 'Compilação manual' }}

            Para instalar: baixe o arquivo .apk abaixo no celular ou no tablet e toque nele.
            As versões novas instalam por cima e mantêm os dados.
          files: inventario-florestal-1.0.${{ github.run_number }}.apk
          make_latest: true
