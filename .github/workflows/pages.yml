# Publica o app (pasta www) no GitHub Pages, para instalar no iPhone pelo Safari.
# Endereço: https://gabrielgordin.github.io/inventariooliveira/
name: Publicar versão web (iPhone)

on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
